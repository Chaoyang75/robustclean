[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robustclean"
version = "0.1.0"
description = "面向科研数据的多方法共识异常值检测与清洗工具"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Chaoyang75" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.scripts]
robustclean = "robustclean.cli:main"
robustclean-gui = "robustclean.gui:main"

[tool.setuptools.packages.find]
include = ["robustclean*"]
